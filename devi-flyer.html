<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devi — Free Garba Workshop Flyer</title>
<style>
  :root{
    --crimson-deep: #2c0810;
    --gold: #ffd166;
    --cream: #fff3e6;
    --blush-muted: #f4c3ae;
  }
  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; background: var(--crimson-deep); }

  .stage{
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: clamp(1.25rem, 4vw, 3rem) 1rem;
    font-family: -apple-system, 'Avenir Next', 'Segoe UI', sans-serif;
  }

  .wrap{
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .flyer-img{
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.65);
    display: block;
  }

  .cta{
    width: 100%;
    margin-top: 1.5rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1em;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), #ffe3a3);
    box-shadow: 0 12px 28px -10px rgba(255,209,102,0.6);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 1rem;
    color: var(--crimson-deep);
    transition: transform 0.15s ease;
  }
  .cta:hover{ transform: translateY(-1px); }

  .fallback{
    margin-top: 0.9rem;
    font-size: 0.78rem;
    color: var(--blush-muted);
    text-align: center;
  }
  .fallback strong{ color: var(--cream); }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap">
    <img class="flyer-img" src="flyer.jpeg" alt="Devi Garba Studio — Free Garba Workshop, Sun Aug 23, 10:30-11:30 AM, Allen TX, women only, limited to 20 spots" />
    <a class="cta" href="devi-rsvp.html">RSVP Here &rarr;</a>
    <p class="fallback">Or message us directly on WhatsApp: <strong>(214) 509-8178</strong></p>
  </div>
</div>
</body>
</html>
